<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rekap Corrugator HS250</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rekap Corr">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#1b2333;--mute:#6b7690;--line:#e1e6ef;--navy:#14213d;--s1:#2563eb;--s2:#f59e0b;--s3:#10b981;--tot:#14213d;--head:#eef2f9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header.top{background:linear-gradient(120deg,#14213d,#1f3a6b);color:#fff;border-radius:14px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
header.top h1{margin:0;font-size:21px;letter-spacing:.3px}
header.top p{margin:4px 0 0;opacity:.8;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14)}
.dot{width:8px;height:8px;border-radius:50%;background:#9aa4b8}
.dot.ok{background:#34d399}.dot.warn{background:#fbbf24}.dot.err{background:#f87171}
.filters{margin:16px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end}
.filters label{display:block;font-size:11px;font-weight:700;color:var(--mute);letter-spacing:.6px;margin-bottom:4px}
select,button,.btn{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-width:150px}
button,.btn{cursor:pointer;min-width:0;font-weight:600}
button:hover,.btn:hover{background:var(--head)}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;border-top:4px solid var(--navy)}
.kpi small{color:var(--mute);font-weight:600;font-size:12px}
.kpi b{display:block;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--mute)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card h2{margin:0;padding:11px 16px;font-size:13px;letter-spacing:.4px;color:#fff}
.sh1 h2{background:var(--s1)}.sh2 h2{background:var(--s2)}.sh3 h2{background:var(--s3)}.gab h2{background:var(--tot)}.pct h2{background:#475b85}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--head);font-size:11.5px;color:#41506e;text-transform:none}
th:nth-child(1),td:nth-child(1){text-align:center;width:44px}
th:nth-child(2),td:nth-child(2){text-align:left;font-weight:600}
tr.total td{background:var(--head);font-weight:700;border-top:2px solid #c9d2e3}
tbody tr:hover td{background:#f8faff}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin:14px 0}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.chartbox h3{margin:0 0 8px;font-size:13px;color:#41506e}
.chartbox .cv{position:relative;height:290px}
.note{background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:12px 16px;font-size:13px;color:#7a5b06;margin-top:14px}
.note table{margin-top:8px;background:#fff}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tabs a{padding:8px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:13px}
.tabs a:hover{background:var(--head)}.tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card h2,.chartbox h3,.note .nh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.fsbtn{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:6px;padding:3px 9px;min-width:0;font-size:15px;line-height:1.2;cursor:pointer}
.fsbtn:hover{background:rgba(255,255,255,.35)}
.chartbox .fsbtn,.note .fsbtn{background:var(--head);color:#41506e}
.chartbox .fsbtn:hover,.note .fsbtn:hover{background:#dde4f1}
.is-fs{position:fixed!important;inset:0;z-index:9999;margin:0!important;border-radius:0!important;overflow:auto;background:var(--card);display:flex;flex-direction:column;border:0!important}
.is-fs.note{background:#fffbeb}
.is-fs h2,.is-fs h3,.is-fs .nh{padding:12px 20px;font-size:clamp(15px,2.4vmin,24px)}
.is-fs .nh{padding:12px 4px}
.is-fs .scroll{flex:1}
.is-fs table{font-size:clamp(15px,2.6vmin,30px)}
.is-fs th,.is-fs td{padding:1.5vmin 2vmin}
.is-fs.chartbox{padding:0}.is-fs.chartbox .cv{height:auto;flex:1;margin:10px 20px 16px}
.is-fs .fsbtn{font-size:0}.is-fs .fsbtn::before{content:"✕ Tutup";font-size:14px;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--mute)}
footer{margin-top:18px;color:var(--mute);font-size:12px;text-align:center}
@media print{
 body{background:#fff}.filters button,.filters .btn,.filters select,.fsbtn,.tabs{display:none}.filters{border:0;padding:0}
 .badge{border:1px solid #fff}.wrap{padding:0}header.top,.card h2,.kpi{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .card,.chartbox,.kpi{break-inside:avoid}@page{size:A4 landscape;margin:10mm}
}
</style>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div>
   <h1>REKAPITULASI HASIL PRODUKSI CORRUGATOR (HS250) PER SHIFT &amp; FLUTE</h1>
   <p id="periode">Memuat data…</p>
  </div>
  <span class="badge"><i class="dot" id="dot"></i><span id="status">Menghubungkan ke Google Sheet…</span></span>
 </header>

 <section class="filters">
  <div><label for="selBulan">PILIH BULAN</label><select id="selBulan"></select></div>
  <div><label for="selTahun">PILIH TAHUN</label><select id="selTahun"></select></div>
  <div class="sp"></div>
  <button id="btnRefresh">⟳ Refresh data</button>
  <label class="btn" style="margin:0;font-size:inherit;color:inherit;letter-spacing:0">Muat CSV manual<input id="file" type="file" accept=".csv" hidden></label>
  <button onclick="window.print()">🖨 Cetak / PDF</button>
 </section>

 <div id="app"></div>
 <footer id="foot"></footer>
</div>

<script>
/* ====== KONFIGURASI ====== */
const MESIN = "HS250";
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT6PsQXIi_KnnpZmjuRToMZ8wUPHNTSTE4WFnj0J2m5CR6wAf9C3pgfEqMl3Nyl-Q/pub?gid=948737548&single=true&output=csv"; 
const FLUTES = ["BF","CF","BC","EF","BE"];
const BULAN  = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
/* Data cadangan (dari CSV terlampir) dipakai jika Google Sheet tidak dapat diakses */
const FALLBACK = [];

/* ====== UTIL ====== */
const FS='<button class="fsbtn" data-fs title="Layar penuh">⛶</button>';
const fmt = n => Math.round(n).toLocaleString("id-ID");
const pct = n => (n*100).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})+"%";
const num = s => { if(s==null) return 0; s=String(s).trim(); if(!s) return 0;
  const v=parseFloat(s.replace(/\./g,"").replace(",",".")); return isNaN(v)?0:v; };

function parseCSV(text){
  const rows=[]; let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){row.push(f);f="";}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f="";}
    else if(c!=="\r") f+=c;
  }
  if(f!==""||row.length){row.push(f);rows.push(row);}
  return rows;
}
function toRecords(text){
  const r=parseCSV(text); const h=r[0].map(x=>x.trim());
  const ix=n=>h.indexOf(n);
  const I={b:ix("Bulan"),t:ix("Tahun"),s:ix("Shift"),f:ix("Flute"),w:ix("WO#"),p:ix("Hasil Corr"),k:ix("Hasil (Kg)"),m:ix("RM")};
  if(Object.values(I).some(v=>v<0)) throw new Error("Kolom tidak lengkap");
  const out=[];
  for(const x of r.slice(1)){
    const bulan=(x[I.b]||"").trim(), shift=parseInt(x[I.s]);
    if(!bulan||![1,2,3].includes(shift)) continue;
    out.push({b:bulan,t:String(parseInt(x[I.t])||""),s:shift,f:(x[I.f]||"").trim()||"(Kosong)",
      p:num(x[I.p]),k:num(x[I.k]),m:num(x[I.m])});
  }
  return out;
}

/* ====== STATE ====== */
let DATA=[], charts=[];
const $=id=>document.getElementById(id);
function setStatus(kind,msg){ $("dot").className="dot "+kind; $("status").textContent=msg; }

function fillFilters(keepB,keepT){
  const bs=[...new Set(DATA.map(d=>d.b))].sort((a,b)=>BULAN.indexOf(a)-BULAN.indexOf(b));
  const ts=[...new Set(DATA.map(d=>d.t))].sort();
  const firstB=DATA.length?DATA[0].b:"SEMUA";
  $("selBulan").innerHTML=["SEMUA",...bs].map(v=>`<option>${v}</option>`).join("");
  $("selTahun").innerHTML=["SEMUA",...ts].map(v=>`<option>${v}</option>`).join("");
  $("selBulan").value=bs.includes(keepB)||keepB==="SEMUA"?keepB:firstB;
  $("selTahun").value=ts.includes(keepT)||keepT==="SEMUA"?keepT:(DATA.length?DATA[0].t:"SEMUA");
}

/* ====== AGREGASI ====== */
function agg(rows){
  const o={}; FLUTES.forEach(f=>o[f]={p:0,k:0,m:0,w:0});
  rows.forEach(r=>{ const a=o[r.f]; if(!a) return; a.p+=r.p;a.k+=r.k;a.m+=r.m;a.w++; });
  const t={p:0,k:0,m:0,w:0}; FLUTES.forEach(f=>{for(const k in t)t[k]+=o[f][k]});
  return {by:o,tot:t};
}
function table(a,withPct){
  const T=a.tot;
  const body=FLUTES.map((f,i)=>{const x=a.by[f];
    return withPct
     ?`<tr><td>${i+1}</td><td>${f}</td><td>${pct(T.p?x.p/T.p:0)}</td><td>${pct(T.k?x.k/T.k:0)}</td><td>${pct(T.m?x.m/T.m:0)}</td><td>${pct(T.w?x.w/T.w:0)}</td></tr>`
     :`<tr><td>${i+1}</td><td>${f}</td><td>${fmt(x.p)}</td><td>${fmt(x.k)}</td><td>${fmt(x.m)}</td><td>${fmt(x.w)}</td></tr>`}).join("");
  const foot=withPct
   ?`<tr class="total"><td></td><td>TOTAL (5 FLUTE)</td><td>${pct(1)}</td><td>${pct(1)}</td><td>${pct(1)}</td><td>${pct(1)}</td></tr>`
   :`<tr class="total"><td></td><td>TOTAL (5 FLUTE)</td><td>${fmt(T.p)}</td><td>${fmt(T.k)}</td><td>${fmt(T.m)}</td><td>${fmt(T.w)}</td></tr>`;
  return `<div class="scroll"><table><thead><tr><th>No</th><th>Flute</th><th>Hasil Corr (Pcs)</th><th>Hasil (Kg)</th><th>RM (Meter)</th><th>Jumlah Order (WO)</th></tr></thead><tbody>${body}${foot}</tbody></table></div>`;
}

/* ====== RENDER ====== */
function render(){
  exitFS();
  const b=$("selBulan").value, t=$("selTahun").value;
  const rows=DATA.filter(d=>(b==="SEMUA"||d.b===b)&&(t==="SEMUA"||d.t===t));
  $("periode").textContent=`Periode: ${b==="SEMUA"?"Semua bulan":b} ${t==="SEMUA"?"(semua tahun)":t} · ${rows.length.toLocaleString("id-ID")} baris data`;
  charts.forEach(c=>c.destroy()); charts=[];
  if(!rows.length){ $("app").innerHTML=CSV_URL?'<div class="card empty">Tidak ada data untuk periode ini.</div>':'<div class="card empty"><b>Link Google Sheet untuk mesin '+MESIN+' belum diisi.</b><br>Isi konstanta <code>CSV_URL</code> pada bagian KONFIGURASI di file ini.</div>'; return; }

  const S=[1,2,3].map(s=>agg(rows.filter(r=>r.s===s)));
  const G=agg(rows);
  const rest=rows.filter(r=>!FLUTES.includes(r.f));
  const rp=rest.reduce((a,r)=>a+r.p,0), rk=rest.reduce((a,r)=>a+r.k,0), rm=rest.reduce((a,r)=>a+r.m,0);
  const allP=rows.reduce((a,r)=>a+r.p,0);

  const kpi=(l,v,s)=>`<div class="kpi"><small>${l}</small><b>${v}</b><span>${s}</span></div>`;
  const shiftCard=(i)=>`<div class="card sh${i+1}"><h2><span>SHIFT ${i+1} — REKAP PER FLUTE (BF, CF, BC, EF, BE)</span>${FS}</h2>${table(S[i])}</div>`;

  $("app").innerHTML=`
   <div class="kpis">
    ${kpi("Total Hasil Corr (Pcs)",fmt(G.tot.p),"Gabungan Shift 1–3")}
    ${kpi("Total Hasil (Kg)",fmt(G.tot.k),"Gabungan Shift 1–3")}
    ${kpi("Total RM (Meter)",fmt(G.tot.m),"Gabungan Shift 1–3")}
    ${kpi("Jumlah Order (WO)",fmt(G.tot.w),"Gabungan Shift 1–3")}
   </div>
   <div class="grid3">${[0,1,2].map(shiftCard).join("")}</div>
   <div class="grid3">
    <div class="card gab"><h2><span>TOTAL GABUNGAN SHIFT 1, 2 &amp; 3 — PER FLUTE</span>${FS}</h2>${table(G)}</div>
    <div class="card pct"><h2><span>TOTAL GABUNGAN SHIFT 1, 2 &amp; 3 — PER FLUTE (%)</span>${FS}</h2>${table(G,true)}</div>
   </div>
   <div class="charts">
    <div class="chartbox"><h3><span>Hasil Corr (Pcs) per Flute &amp; Shift</span>${FS}</h3><div class="cv"><canvas id="c1"></canvas></div></div>
    <div class="chartbox"><h3><span>Hasil (Kg) per Flute &amp; Shift</span>${FS}</h3><div class="cv"><canvas id="c2"></canvas></div></div>
    <div class="chartbox"><h3><span>Proporsi Hasil Corr (Pcs) per Flute</span>${FS}</h3><div class="cv"><canvas id="c3"></canvas></div></div>
   </div>
   <div class="note"><div class="nh"><b>Catatan / rekonsiliasi flute lainnya di data raw (tanpa flute / “(Kosong)”)</b>${FS}</div>
    <div class="scroll"><table><thead><tr><th>No</th><th>Keterangan</th><th>Hasil Corr (Pcs)</th><th>Hasil (Kg)</th><th>RM (Meter)</th><th>Jumlah Baris</th></tr></thead><tbody>
     <tr><td>1</td><td>Baris tanpa flute</td><td>${fmt(rp)}</td><td>${fmt(rk)}</td><td>${fmt(rm)}</td><td>${fmt(rest.length)}</td></tr>
     <tr class="total"><td></td><td>GRAND TOTAL ALL DATA (5 flute + tanpa flute)</td><td>${fmt(allP)}</td><td>${fmt(G.tot.k+rk)}</td><td>${fmt(G.tot.m+rm)}</td><td>${fmt(rows.length)}</td></tr>
    </tbody></table></div>
    Rekap per flute di atas hanya menghitung BF, CF, BC, EF dan BE; baris sample/tanpa flute dipisahkan di sini.</div>`;

  if(typeof Chart==="undefined"){ $("app").insertAdjacentHTML("beforeend",'<div class="note">Grafik tidak tampil: library Chart.js belum termuat (offline dan belum pernah di-cache).</div>'); return; }
  const cols=["#2563eb","#f59e0b","#10b981"];
  const bar=(id,key)=>charts.push(new Chart($(id),{type:"bar",
    data:{labels:FLUTES,datasets:S.map((a,i)=>({label:"Shift "+(i+1),backgroundColor:cols[i],borderRadius:4,data:FLUTES.map(f=>a.by[f][key])}))},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw)}`}}},
      scales:{y:{beginAtZero:true,ticks:{callback:v=>fmt(v)}}}}}));
  bar("c1","p"); bar("c2","k");
  charts.push(new Chart($("c3"),{type:"pie",
    data:{labels:FLUTES,datasets:[{data:FLUTES.map(f=>G.by[f].p),backgroundColor:["#2563eb","#10b981","#f59e0b","#8b5cf6","#ef4444"]}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"bottom"},
      tooltip:{callbacks:{label:c=>`${c.label}: ${fmt(c.raw)} (${pct(G.tot.p?c.raw/G.tot.p:0)})`}}}}}));
}


/* ====== LAYAR PENUH ====== */
let fsEl=null;
function exitFS(){ if(!fsEl) return; fsEl.classList.remove("is-fs"); fsEl=null; document.body.style.overflow="";
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  setTimeout(()=>charts.forEach(c=>c.resize()),120); }
function enterFS(el){ fsEl=el; el.classList.add("is-fs"); document.body.style.overflow="hidden";
  if(el.requestFullscreen){ const r=el.requestFullscreen(); if(r&&r.catch) r.catch(()=>{}); } /* iOS: pakai overlay CSS saja */
  setTimeout(()=>charts.forEach(c=>c.resize()),150); }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-fs]"); if(!b) return;
  const box=b.closest(".card,.chartbox,.note"); if(fsEl===box) exitFS(); else { exitFS(); enterFS(box); } });
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement&&fsEl) exitFS(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") exitFS(); });

/* ====== LOAD DATA ====== */
function apply(records,msg,kind){
  const b=$("selBulan").value||"", t=$("selTahun").value||"";
  DATA=records; fillFilters(b,t); setStatus(kind,msg); render();
  $("foot").textContent="Diperbarui: "+new Date().toLocaleString("id-ID");
}
async function load(){
  if(!CSV_URL){ apply(FALLBACK,"Link Google Sheet belum diisi","warn"); return; }
  setStatus("warn","Menghubungkan ke Google Sheet…");
  try{
    const res=await fetch(CSV_URL+"&_="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const recs=toRecords(await res.text());
    if(!recs.length) throw new Error("Data kosong");
    apply(recs,"Live dari Google Sheet","ok");
  }catch(e){
    console.warn(e);
    apply(FALLBACK,"Google Sheet tidak terjangkau — memakai data cadangan (CSV terlampir)","err");
  }
}
$("selBulan").onchange=render; $("selTahun").onchange=render; $("btnRefresh").onclick=load;
$("file").onchange=e=>{const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>apply(toRecords(t),"Data dari CSV manual: "+f.name,"warn")).catch(()=>alert("CSV tidak valid"));};
load();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW gagal:",e)));
}
</script>
</body>
</html>
