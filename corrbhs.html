    /* ==========================================================================
       2. LAYOUT DENGAN SIDEBAR
       ========================================================================== */
    .layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, rgba(16, 27, 51, 0.96) 0%, rgba(24, 42, 78, 0.95) 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #fff;
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 1000;
      transition: transform 0.25s ease;
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.25);
    }

    .sb-brand {
      padding: 20px 18px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .sb-brand-info {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .sb-logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      flex-shrink: 0;
    }

    .sb-title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.3px;
      line-height: 1.25;
    }

    .sb-sub {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 2px;
    }

    .sb-close {
      display: none;
      background: rgba(255, 255, 255, 0.12);
      border: 0;
      color: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      min-width: 0;
    }

    .sb-section-label {
      padding: 16px 18px 8px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.5);
    }

    .sb-nav {
      list-style: none;
      margin: 0;
      padding: 0 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      text-align: left;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: transparent;
      color: rgba(255, 255, 255, 0.84);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .sb-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .sb-item.active {
      background: linear-gradient(90deg, rgba(37, 99, 235, 0.9), rgba(29, 78, 216, 0.85));
      color: #fff;
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }

    .sb-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.14);
      font-size: 11.5px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .sb-item.active .sb-num {
      background: rgba(255, 255, 255, 0.25);
    }

    .sb-icon {
      width: 17px;
      height: 17px;
      fill: currentColor;
      flex-shrink: 0;
      opacity: 0.9;
    }

    .sb-footer {
      padding: 14px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sb-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      transition: background 0.15s ease;
    }

    .sb-home:hover {
      background: rgba(255, 255, 255, 0.24);
    }

    .sb-home svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .sb-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(9, 14, 26, 0.6);
      z-index: 950;
      backdrop-filter: blur(2px);
    }

    .sb-backdrop.show {
      display: block;
    }

    .main-area {
      flex: 1;
      margin-left: var(--sidebar-w);
      min-width: 0;
    }

    .wrap {
      max-width: 1320px;
      margin: 0 auto;
      padding: 20px 18px 40px;
    }

    /* ==========================================================================
       3. HEADER & TOMBOL MENU MOBILE
       ========================================================================== */
    header.top {
      background: linear-gradient(120deg, rgba(20, 33, 61, 0.95), rgba(31, 58, 107, 0.92));
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.22);
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-toggle {
      display: none;

      gap: 6px;

      border-radius: 10px;

      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.24);

      height: 8px;

    .dot.warn { background: #fbbf24; }
    .dot.err  { background: #f87171; }

    /* ==========================================================================
       4. FILTER & KONTROL

    .filters {

      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      padding: 14px 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: flex-end;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .filters label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--mute);
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }

    select, button, .btn, input[type="text"], input[type="number"], input[type="date"], textarea {
      font: inherit;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      min-width: 150px;
    }

    button, .btn {
      cursor: pointer;
      min-width: 0;
      font-weight: 600;
    }

    button:hover, .btn:hover {
      background: var(--head);
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .btn-primary:hover {
      background: var(--navy-light);
    }

    .sp {
      flex: 1;
    }

    /* ==========================================================================
       5. KPI CARDS & PANEL KONTEN
       ========================================================================== */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .kpi {
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      padding: 14px 16px;
      border-top: 4px solid var(--navy);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .kpi small {
      color: var(--mute);
      font-weight: 600;
      font-size: 12px;
    }

    .kpi b {
      display: block;
      font-size: 23px;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    .kpi span {
      font-size: 12px;
      color: var(--mute);
    }

    /* ==========================================================================
       6. TABEL & KARTU SHIFT
       ========================================================================== */
    .grid2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .grid3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      margin-bottom: 14px;
    }

    .grid2 .card, .grid3 .card {
      margin-bottom: 0;
    }

    .card h2 {
      margin: 0;
      padding: 11px 16px;
      font-size: 13px;
      letter-spacing: 0.4px;
      color: #fff;
      background: var(--navy);
    }

    .sh1 h2 { background: var(--s1); }
    .sh2 h2 { background: var(--s2); }
    .sh3 h2 { background: var(--s3); }

    .err-hd h2 { background: #b91c1c; }
    .ok-hd h2 { background: #047857; }

    .card-body {
      padding: 16px;
    }

    .scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.7);
    }

    th, td {
      padding: 8px 12px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }

    th {
      background: var(--head);
      font-size: 11.5px;
      color: #41506e;
      text-transform: none;
    }

    th:nth-child(1), td:nth-child(1) {
      text-align: center;
      width: 44px;
    }

    th:nth-child(2), td:nth-child(2) {
      text-align: left;
      font-weight: 600;
    }

    tr.total td {
      background: var(--head);
      font-weight: 700;
      border-top: 2px solid #c9d2e3;
    }

    tbody tr:hover td {
      background: #f8faff;
    }

    /* ==========================================================================
       7. GRAFIK (CHARTS) & CATATAN REKONSILIASI
       ========================================================================== */
    .charts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 14px;
      margin: 14px 0;
    }

    .chartbox {
      background: var(--card);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .chartbox h3 {
      margin: 0 0 8px;
      font-size: 13px;
      color: #41506e;
    }

    .chartbox .cv {
      position: relative;
      height: 290px;
    }

    .note {
      background: rgba(255, 251, 235, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      color: #7a5b06;
      margin-top: 14px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
    }

    .note table {
      margin-top: 8px;
      background: #fff;
    }

    /* ==========================================================================
       8. FORM INPUT & STATUS BADGE MODUL TAMBAHAN
       ========================================================================== */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--mute);
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      min-width: 0;
    }

    .pill {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 700;

    .del-btn {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 4px 8px;
      font-size: 11.5px;
      border-radius: 6px;
    }
    .del-btn:hover {
      background: #fecaca;
    }

    /* ==========================================================================
       9. LAYAR PENUH (FULLSCREEN) & FOOTER
       ========================================================================== */
    .card h2, .chartbox h3, .note .nh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .fsbtn {
      background: rgba(255, 255, 255, 0.2);
      border: 0;
      color: #fff;
      border-radius: 6px;
      padding: 3px 9px;
      min-width: 0;
      font-size: 15px;
      line-height: 1.2;
      cursor: pointer;
    }

    .fsbtn:hover { background: rgba(255, 255, 255, 0.35); }
    .chartbox .fsbtn, .note .fsbtn { background: var(--head); color: #41506e; }
    .chartbox .fsbtn:hover, .note .fsbtn:hover { background: #dde4f1; }

    .is-fs {

      inset: 0;
      z-index: 9999;
      margin: 0 !important;
      border-radius: 0 !important;

      background: var(--card-solid);
      display: flex;
      flex-direction: column;
      border: 0 !important;

    .is-fs.note { background: #fffbeb; }

    .is-fs th, .is-fs td { padding: 1.5vmin 2vmin; }

    .is-fs.chartbox .cv { height: auto; flex: 1; margin: 10px 20px 16px; }
    .is-fs .fsbtn { font-size: 0; }
    .is-fs .fsbtn::before { content: "✕ Tutup"; font-size: 14px; font-weight: 600; }

    .empty {
      padding: 40px;
      text-align: center;

    footer {
      margin-top: 20px;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(15, 23, 42, 0.55);

      padding: 10px 14px;

      // Ini mencegah baris petunjuk di bagian atas CSV terbaca sebagai header.
      let headerIdx = -1;
      for (let i = 0; i < Math.min(15, r.length); i++) {
        const cols = r[i].map(x => String(x || "").trim().toLowerCase());
        const hasBulan = cols.some(x => /^bulan$/.test(x));
        const hasTahun = cols.some(x => /^tahun$/.test(x));
        const hasRegu = cols.some(x => /^(kepala\\s*regu|ka\\.?\\s*regu|karu|regu)$/.test(x));
        const hasWeek = cols.some(x => /^(minggu|week|wk)$/.test(x));
        if (hasBulan && hasTahun && hasRegu && hasWeek) {
          headerIdx = i;
          break;
        }
      }
      if (headerIdx < 0) {
        throw new Error("Baris header CSV tidak ditemukan (butuh kolom Bulan, Tahun, Kepala Regu, dan Minggu)");
      }

      const h = r[headerIdx].map(x => String(x || "").trim());
      const findCol = regex => h.findIndex(col => regex.test(col));

      const cBulan   = findCol(/^bulan$|month/i);
      const cTahun   = findCol(/^tahun$|year/i);
      const cTanggal = findCol(/tanggal|tgl|date/i);
      const cWeek    = findCol(/^week$|^minggu$|^wk$|^w$/i);
      const cRegu    = findCol(/kepala\s*regu|ka\.?\s*regu|karu|^regu$|team|group|leader/i);
      const cShift   = findCol(/^shift$|shf/i);
      const cJmlShf  = findCol(/jml\s*shift|jumlah\s*shift|total\s*shift|count\s*shift/i);
      const cRm      = h.findIndex(col => (/^rm$|^rm\s*\(|running\s*meter|total\s*rm|hasil\s*rm/i).test(col) && !/avg|rata|target|std|\/shift/i.test(col));
      const cTargetRm= findCol(/target\s*rm|std\s*rm|standar\s*rm/i);
      const cTonase  = findCol(/tonase| ton |hasil\s*\(kg\)|berat|weight|^kg$/i);
      const cEff     = findCol(/ef[ie]siensi| eff |efficiency/i);
      const cAvgRm   = findCol(/avg.*rm|rata.*rm|rm\s*\/\s*shift|rm\s*per\s*shift/i);

      // Deteksi unit tonase dari header (Ton vs Kg)
      let tonUnit = "Kg";
      if (cTonase >= 0 && / ton /i.test(h[cTonase]) && !/tonase/i.test(h[cTonase])) {
        tonUnit = "Ton";
      }

      const out = [];
      let currentReguContext = "";

      for (const x of r.slice(headerIdx + 1)) {
        if (!x || x.every(cell => !String(cell || "").trim())) continue;

        // Jika nama regu muncul sebagai sub-judul blok baris
        if (cRegu < 0) {
          const blockRegu = normalizeRegu(x.join(" "));
          if (blockRegu && x.filter(c => String(c || "").trim()).length <= 2) {
            currentReguContext = blockRegu;
            continue;
          }
        }

        const reguRaw = cRegu >= 0 ? x[cRegu] : currentReguContext;
        const regu = normalizeRegu(reguRaw);
        if (!regu) continue;

        const dInfo = cTanggal >= 0 ? parseDateInfo(x[cTanggal]) : null;
        let b = cBulan >= 0 ? normalizeBulan(x[cBulan]) : "";
        let t = cTahun >= 0 ? String(parseInt(x[cTahun]) || "").trim() : "";

        if (!b && dInfo) b = dInfo.b;
        if (!t && dInfo) t = dInfo.t;
        if (!b) b = "September";
        if (!t) t = "2026";

        const w = normalizeWeek(cWeek >= 0 ? x[cWeek] : "", dInfo ? dInfo.day : null);
        const rm = cRm >= 0 ? numSmart(x[cRm]) : 0;
        const targetRm = cTargetRm >= 0 ? numSmart(x[cTargetRm]) : 0;
        const ton = cTonase >= 0 ? numSmart(x[cTonase]) : 0;

        let eff = 0;
        if (cEff >= 0 && String(x[cEff] || "").trim() !== "") {
          eff = numSmart(x[cEff]);
          if (eff > 0 && eff <= 1.5) eff = eff * 100;
        } else if (targetRm > 0 && rm > 0) {
          eff = (rm / targetRm) * 100;
        }

        const shifts = cJmlShf >= 0 ? (numSmart(x[cJmlShf]) || 1) : 1;
        const avgRmExplicit = cAvgRm >= 0 ? numSmart(x[cAvgRm]) : 0;
        const shiftId = cShift >= 0 ? String(x[cShift] || "").trim() : "";
        const dateKey = cTanggal >= 0 ? String(x[cTanggal] || "").trim() : "";

        out.push({
          b,
          t,
          w,
          regu,
          rm,
          ton,
          tonUnit,
          eff,
          shifts,
          avgRmExplicit,
          shiftKey: (dateKey || shiftId) ? `${dateKey}|${shiftId}` : ""
        });
      }

      if (!out.length) {
        throw new Error("Data Regu Yapet, Sugeng, atau Ace tidak ditemukan pada CSV");
      }
      return out;
    }

    /* ==========================================================================
       4. STATE, SIDEBAR NAVIGATION & FILTER DROPDOWN
       ========================================================================== */
    let DATA = [];
    let DATA_ANALISA = [];
    let STATUS_MAIN = { kind: "warn", msg: "Menghubungkan ke Google Sheet…" };
    let STATUS_ANALISA = { kind: "warn", msg: "Menghubungkan ke Google Sheet Analisa BHS…" };
    let charts = [];
    let activeMenu = "analisa-mesin";
    const $ = id => document.getElementById(id);

    const MENU_TITLES = {
      "analisa-mesin": "ANALISA MESIN CORRUGATOR (BHS) PER KEPALA REGU",
      "hasil-flute": "REKAPITULASI HASIL PRODUKSI CORRUGATOR (BHS) PER SHIFT & FLUTE",
      "waste": "MONITORING & ANALISA WASTE CORRUGATOR (BHS)",
      "analisa-project": "ANALISA PROJECT & TARGET PENCAPAIAN CORRUGATOR (BHS)",
      "kerusakan-mesin": "LOG & UPDATE KERUSAKAN MESIN CORRUGATOR (BHS)"
    };

    function setStatus(kind, msg) {
      $("dot").className = "dot " + kind;
      $("status").textContent = msg;
    }

    function closeMobileSidebar() {
      $("sidebar").classList.remove("open");
      $("sbBackdrop").classList.remove("show");
    }

    function openMobileSidebar() {
      $("sidebar").classList.add("open");
      $("sbBackdrop").classList.add("show");
    }

    function fillFilters(keepB, keepT, preferSep2026 = false) {
      const source = activeMenu === "analisa-mesin" ? DATA_ANALISA : DATA;
      const bsSet = new Set(source.map(d => d.b));
      const tsSet = new Set(source.map(d => d.t));
      let latestB = "September", latestT = "2026";
      if (preferSep2026 && source.length) {
        let best = null;
        source.forEach(d => {
          const key = (parseInt(d.t) || 0) * 100 + BULAN.indexOf(d.b);
          if (!best || key > best.key) best = { key, b: d.b, t: d.t };
        });
        if (best) { latestB = best.b; latestT = best.t; }
      }
      if (preferSep2026) {
        bsSet.add(latestB);
        tsSet.add(latestT);
      }

      const bs = [...bsSet].sort((a, b) => BULAN.indexOf(a) - BULAN.indexOf(b));
      const ts = [...tsSet].sort();
      const firstB = source.length ? source[0].b : "SEMUA";
      const firstT = source.length ? source[0].t : "SEMUA";

      $("selBulan").innerHTML = ["SEMUA", ...bs].map(v => `<option>${v}</option>`).join("");
      $("selTahun").innerHTML = ["SEMUA", ...ts].map(v => `<option>${v}</option>`).join("");

      if (preferSep2026) {
        // pertahankan pilihan user jika masih valid, jika tidak pakai bulan terbaru
        $("selBulan").value = (bs.includes(keepB) && keepB !== "September") || (keepB === "September" && latestB === "September") ? keepB : latestB;
        $("selTahun").value = (ts.includes(keepT) && keepT !== "2026") || (keepT === "2026" && latestT === "2026") ? keepT : latestT;
      } else {
        $("selBulan").value = (bs.includes(keepB) || keepB === "SEMUA") ? keepB : firstB;
        $("selTahun").value = (ts.includes(keepT) || keepT === "SEMUA") ? keepT : firstT;
      }
    }

    function switchMenu(menuKey) {
      activeMenu = menuKey;
      document.querySelectorAll(".sb-item").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.menu === menuKey);
      });
      $("pageTitle").textContent = MENU_TITLES[menuKey] || MENU_TITLES["hasil-flute"];
      closeMobileSidebar();

      if (menuKey === "analisa-mesin") {
        setStatus(STATUS_ANALISA.kind, STATUS_ANALISA.msg);
        fillFilters("September", "2026", true);
      } else {
        setStatus(STATUS_MAIN.kind, STATUS_MAIN.msg);
        fillFilters($("selBulan").value, $("selTahun").value, false);
      }
      render();
    }

    /* ==========================================================================
       5. AGREGASI & PEMBUATAN TABEL
       ========================================================================== */
    function agg(rows) {
      const o = {};
      FLUTES.forEach(f => o[f] = { p: 0, k: 0, m: 0, w: 0 });

      rows.forEach(r => {
        const a = o[r.f];
        if (!a) return;
        a.p += r.p;
        a.k += r.k;
        a.m += r.m;
        a.w++;
      });

      const t = { p: 0, k: 0, m: 0, w: 0 };
      FLUTES.forEach(f => {
        for (const k in t) t[k] += o[f][k];
      });

      return { by: o, tot: t };
    }

    function table(a, withPct) {
      const T = a.tot;
      const body = FLUTES.map((f, i) => {
        const x = a.by[f];
        return withPct
          ? `<tr><td>${i + 1}</td><td>${f}</td><td>${pct(T.p ? x.p / T.p : 0)}</td><td>${pct(T.k ? x.k / T.k : 0)}</td><td>${pct(T.m ? x.m / T.m : 0)}</td><td>${pct(T.w ? x.w / T.w : 0)}</td></tr>`
          : `<tr><td>${i + 1}</td><td>${f}</td><td>${fmt(x.p)}</td><td>${fmt(x.k)}</td><td>${fmt(x.m)}</td><td>${fmt(x.w)}</td></tr>`;
      }).join("");

      const foot = withPct
        ? `<tr class="total"><td></td><td>TOTAL (5 FLUTE)</td><td>${pct(1)}</td><td>${pct(1)}</td><td>${pct(1)}</td><td>${pct(1)}</td></tr>`
        : `<tr class="total"><td></td><td>TOTAL (5 FLUTE)</td><td>${fmt(T.p)}</td><td>${fmt(T.k)}</td><td>${fmt(T.m)}</td><td>${fmt(T.w)}</td></tr>`;

      return `
        <div class="scroll">
          <table>
            <thead>
              <tr>
                <th>No</th>
                <th>Flute</th>
                <th>Hasil Corr (Pcs)</th>
                <th>Hasil (Kg)</th>
                <th>RM (Meter)</th>
                <th>Jumlah Order (WO)</th>
              </tr>
            </thead>
            <tbody>${body}${foot}</tbody>
          </table>
        </div>`;
    }

    /* ==========================================================================
       6. RENDER MASING-MASING HALAMAN MENU
       ========================================================================== */
    function renderHasilFlute(rows) {
      const S    = [1, 2, 3].map(s => agg(rows.filter(r => r.s === s)));
      const G    = agg(rows);
      const rest = rows.filter(r => !FLUTES.includes(r.f));
      const rp   = rest.reduce((a, r) => a + r.p, 0);
      const rk   = rest.reduce((a, r) => a + r.k, 0);
      const rm   = rest.reduce((a, r) => a + r.m, 0);
      const allP = rows.reduce((a, r) => a + r.p, 0);

      const kpi = (l, v, s) => `<div class="kpi"><small>${l}</small><b>${v}</b><span>${s}</span></div>`;
      const shiftCard = i => `<div class="card sh${i + 1}"><h2><span>SHIFT ${i + 1} — REKAP PER FLUTE (BF, CF, BC, EF, BE)</span>${FS}</h2>${table(S[i])}</div>`;

      $("app").innerHTML = `
        <div class="kpis">
          ${kpi("Total Hasil Corr (Pcs)", fmt(G.tot.p), "Gabungan Shift 1–3")}
          ${kpi("Total Hasil (Kg)", fmt(G.tot.k), "Gabungan Shift 1–3")}
          ${kpi("Total RM (Meter)", fmt(G.tot.m), "Gabungan Shift 1–3")}

        <div class="grid3">
          ${[0, 1, 2].map(shiftCard).join("")}

        <div class="grid3">
          <div class="card gab"><h2><span>TOTAL GABUNGAN SHIFT 1, 2 &amp; 3 — PER FLUTE</span>${FS}</h2>${table(G)}</div>
          <div class="card pct"><h2><span>TOTAL GABUNGAN SHIFT 1, 2 &amp; 3 — PER FLUTE (%)</span>${FS}</h2>${table(G, true)}</div>
        </div>

        <div class="charts">
          <div class="chartbox"><h3><span>Hasil Corr (Pcs) per Flute &amp; Shift</span>${FS}</h3><div class="cv"><canvas id="c1"></canvas></div></div>
          <div class="chartbox"><h3><span>Hasil (Kg) per Flute &amp; Shift</span>${FS}</h3><div class="cv"><canvas id="c2"></canvas></div></div>
          <div class="chartbox"><h3><span>Proporsi Hasil Corr (Pcs) per Flute</span>${FS}</h3><div class="cv"><canvas id="c3"></canvas></div></div>
        </div>

        <div class="note">
          <div class="nh"><b>Catatan / rekonsiliasi flute lainnya di data raw (tanpa flute / “(Kosong)”)</b>${FS}</div>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>No</th>
                  <th>Keterangan</th>
                  <th>Hasil Corr (Pcs)</th>
                  <th>Hasil (Kg)</th>
                  <th>RM (Meter)</th>
                  <th>Jumlah Baris</th>
                </tr>
              </thead>
              <tbody>
                <tr><td>1</td><td>Baris tanpa flute</td><td>${fmt(rp)}</td><td>${fmt(rk)}</td><td>${fmt(rm)}</td><td>${fmt(rest.length)}</td></tr>
                <tr class="total"><td></td><td>GRAND TOTAL ALL DATA (5 flute + tanpa flute)</td><td>${fmt(allP)}</td><td>${fmt(G.tot.k + rk)}</td><td>${fmt(G.tot.m + rm)}</td><td>${fmt(rows.length)}</td></tr>
              </tbody>
            </table>
          </div>
          Rekap per flute di atas hanya menghitung BF, CF, BC, EF dan BE; baris sample/tanpa flute dipisahkan di sini.
        </div>`;

      if (typeof Chart === "undefined") return;

      const cols = ["#2563eb", "#f59e0b", "#10b981"];
      const bar = (id, key) => charts.push(new Chart($(id), {
        type: "bar",
        data: {
          labels: FLUTES,
          datasets: S.map((a, i) => ({
            label: "Shift " + (i + 1),
            backgroundColor: cols[i],
            borderRadius: 4,
            data: FLUTES.map(f => a.by[f][key])
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" },
            tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmt(c.raw)}` } }
          },
          scales: {
            y: { beginAtZero: true, ticks: { callback: v => fmt(v) } }
          }
        }
      }));

      bar("c1", "p");
      bar("c2", "k");

      charts.push(new Chart($("c3"), {
        type: "pie",
        data: {
          labels: FLUTES,
          datasets: [{
            data: FLUTES.map(f => G.by[f].p),
            backgroundColor: ["#2563eb", "#10b981", "#f59e0b", "#8b5cf6", "#ef4444"]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" },
            tooltip: { callbacks: { label: c => `${c.label}: ${fmt(c.raw)} (${pct(G.tot.p ? c.raw / G.tot.p : 0)})` } }
          }
        }
      }));
    }

    function renderAnalisaMesin(rows) {
      const pad = n => String(n).padStart(2, "0");
      const wn = w => parseInt(String(w).replace(/\D/g, "")) || 0;
      const pkey = r => r.t + "|" + pad(BULAN.indexOf(r.b)) + "|" + r.b;
      const periods = [...new Set(rows.map(pkey))].sort();
      const multi = periods.length > 1;
      const keys = [...new Set(rows.map(r => pkey(r) + "|" + pad(wn(r.w)) + "|" + r.w))].sort();
      const labels = keys.map(k => { const [t, , b, , w] = k.split("|"); return multi ? `${b.slice(0, 3)} ${t.slice(2)} · ${w}` : w; });
      const S = (a, f) => a.reduce((s, x) => s + (x[f] || 0), 0);
      const avgPos = (a, f) => { const v = a.filter(x => x[f] > 0); return v.length ? S(v, f) / v.length : 0; };

      const data = REGU_LIST.map(regu => {
        const wk = keys.map(k => {
          const [t, , b, , w] = k.split("|");
          const sub = rows.filter(r => r.regu === regu && r.t === t && r.b === b && r.w === w);
          const o = { rm: S(sub, "rm"), kg: S(sub, "ton"), pcs: S(sub, "pcs"), m2: S(sub, "m2"), lots: S(sub, "lots"), run: S(sub, "run"), opdt: S(sub, "opdt"), nodt: S(sub, "nodt"), shifts: S(sub, "shifts"), eff: avgPos(sub, "eff"), prod: avgPos(sub, "prod") };
          o.avg = o.shifts > 0 ? o.rm / o.shifts : avgPos(sub, "avgRmExplicit");
          return o;
        });
        const act = wk.filter(x => x.rm > 0 || x.kg > 0);
        const tot = { rm: S(wk, "rm"), kg: S(wk, "kg"), pcs: S(wk, "pcs"), m2: S(wk, "m2"), lots: S(wk, "lots"), run: S(wk, "run"), opdt: S(wk, "opdt"), nodt: S(wk, "nodt"), shifts: S(wk, "shifts"), eff: avgPos(act, "eff"), prod: avgPos(act, "prod") };
        tot.avg = tot.shifts > 0 ? tot.rm / tot.shifts : 0;
        return { regu, wk, tot };
      });

      const dash = v => v > 0 ? null : "-";
      const cell = (v, f) => dash(v) || f(v);
      const tableFor = d => `
        <div class="scroll"><table>
          <thead><tr><th>No</th><th>Week</th><th>Output RM</th><th>Output Kg</th><th>Pcs</th><th>m²</th><th>Lot</th><th>Running (mnt)</th><th>DT Operasional (mnt)</th><th>DT Non-Op (mnt)</th><th>Efisiensi</th><th>Produktivitas</th><th>Avg RM/Shift</th></tr></thead>
          <tbody>
            ${d.wk.map((x, i) => `<tr><td>${i + 1}</td><td>${labels[i]}</td><td>${cell(x.rm, fmt)}</td><td>${cell(x.kg, fmt)}</td><td>${cell(x.pcs, fmt)}</td><td>${cell(x.m2, fmt)}</td><td>${cell(x.lots, fmt)}</td><td>${cell(x.run, fmt)}</td><td>${fmt(x.opdt)}</td><td>${x.nodt > 0 ? fmt(x.nodt) : "-"}</td><td>${cell(x.eff, v => fmtDec(v, 2) + "%")}</td><td>${cell(x.prod, v => fmtDec(v, 2) + "%")}</td><td>${cell(x.avg, fmt)}</td></tr>`).join("")}
            <tr class="total"><td></td><td>TOTAL / RATA-RATA</td><td>${fmt(d.tot.rm)}</td><td>${fmt(d.tot.kg)}</td><td>${fmt(d.tot.pcs)}</td><td>${fmt(d.tot.m2)}</td><td>${fmt(d.tot.lots)}</td><td>${fmt(d.tot.run)}</td><td>${fmt(d.tot.opdt)}</td><td>${d.tot.nodt > 0 ? fmt(d.tot.nodt) : "-"}</td><td>${fmtDec(d.tot.eff, 2)}%</td><td>${fmtDec(d.tot.prod, 2)}%</td><td>${fmt(d.tot.avg)}</td></tr>
          </tbody>
        </table></div>`;

      // Data harian hanya bila satu periode (bulan+tahun) dipilih
      const dailyOf = regu => {
        if (multi) return null;
        const r0 = rows[0];
        const D = ANALISA_DAILY[[regu, r0.b, r0.t].join("|")];
        if (!D) return null;
        const days = Object.keys(D).map(Number).sort((a, b) => a - b);
        return days.length ? { days, D } : null;
      };

      const kpis = data.map(d => `
        <div class="kpi" style="border-top-color:${REGU_COLORS[d.regu]}"><small>${d.regu}</small>
          <b>${fmt(d.tot.rm)} m</b><span>${fmt(d.tot.kg)} Kg · Eff ${fmtDec(d.tot.eff, 2)}% · Prod ${fmtDec(d.tot.prod, 2)}%</span></div>`).join("");

      const blocks = data.map((d, i) => {
        const hasDaily = !!dailyOf(d.regu);
        return `
        <div class="card" style="margin-top:14px">
          <h2 style="background:${REGU_COLORS[d.regu]}"><span>${d.regu.toUpperCase()} — REKAP MINGGUAN & GRAFIK</span>${FS}</h2>
          ${tableFor(d)}
          <div class="grid2" style="padding:12px">
            <div class="chartbox"><h3><span>Output per Week — RM &amp; Kg</span>${FS}</h3><div class="cv"><canvas id="lnOut${i}"></canvas></div></div>
            <div class="chartbox"><h3><span>Efisiensi &amp; Produktivitas per Week (%)</span>${FS}</h3><div class="cv"><canvas id="lnEff${i}"></canvas></div></div>
            ${hasDaily ? `<div class="chartbox" style="grid-column:1/-1"><h3><span>Tren Harian — Output RM, Kg &amp; Efisiensi</span>${FS}</h3><div class="cv"><canvas id="lnDay${i}"></canvas></div></div>` : ""}
          </div>
        </div>`;
      }).join("");

      $("app").innerHTML = `
        <div class="kpis">${kpis}</div>
        <div class="chartbox" style="margin-top:14px"><h3><span>Perbandingan Efisiensi per Week — Yapet vs Sugeng vs Ace (%)</span>${FS}</h3><div class="cv"><canvas id="lnCmp"></canvas></div></div>
        ${blocks}`;

      if (typeof Chart === "undefined") return;

      const nz = v => (v > 0 ? v : null);
      const line = (id, lbls, sets, y0, y1) => charts.push(new Chart($(id), {
        type: "line",
        data: { labels: lbls, datasets: sets.map(s => ({ label: s.l, data: s.d, borderColor: s.c, backgroundColor: s.c + "22", yAxisID: s.y || "y", tension: 0.3, spanGaps: true, pointRadius: 4, pointHoverRadius: 6, borderWidth: 2.5, borderDash: s.dash || [], dec: s.dec || 0 })) },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: { legend: { position: "bottom" }, tooltip: { callbacks: { label: c => `${c.dataset.label}: ${fmtDec(c.raw, c.dataset.dec)}` } } },
          scales: Object.assign({ y: { position: "left", title: { display: !!y0, text: y0 } } },
            y1 ? { y1: { position: "right", grid: { drawOnChartArea: false }, title: { display: true, text: y1 } } } : {})
        }
      }));

      line("lnCmp", labels, data.map(d => ({ l: d.regu, c: REGU_COLORS[d.regu], d: d.wk.map(x => nz(x.eff)), dec: 2 })), "Efisiensi (%)");

      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

    function enterFS(el) {
      fsEl = el;
      el.classList.add("is-fs");
      document.body.style.overflow = "hidden";
      if (el.requestFullscreen) {
        const r = el.requestFullscreen();
        if (r && r.catch) r.catch(() => {});
      }
      setTimeout(() => charts.forEach(c => c.resize()), 150);
    }

      const b = e.target.closest("[data-fs]");

      const box = b.closest(".card, .chartbox, .note");
      if (fsEl === box) exitFS();

    async function fetchCsvText(url, tries = 3) {
      let lastErr;
      for (let i = 0; i < tries; i++) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 20000);
        try {
          const sep = url.includes("?") ? "&" : "?";
          const res = await fetch(url + sep + "_=" + Date.now(), { cache: "no-store", signal: ctrl.signal });
          if (!res.ok) throw new Error("HTTP " + res.status);
          let text = (await res.text()).replace(/^\uFEFF/, "");
          if (/^\s*</.test(text)) throw new Error("Sheet tidak lagi dipublikasikan (balasan HTML)");
          return text;
        } catch (e) {
          lastErr = e.name === "AbortError" ? new Error("timeout") : e;
          if (i < tries - 1) await new Promise(r => setTimeout(r, 700 * (i + 1)));
        } finally {
          clearTimeout(timer);
        }
      }
      throw lastErr;
    }

    async function loadMain() {
      if (!CSV_URL) {
        applyMain(FALLBACK, "Link Google Sheet belum diisi", "warn");
        return;
      }
      if (activeMenu !== "analisa-mesin") setStatus("warn", "Menghubungkan ke Google Sheet…");
      try {
        const recs = toRecords(await fetchCsvText(CSV_URL));
        if (!recs.length) throw new Error("Data kosong");
        applyMain(recs, "Live dari Google Sheet", "ok");
      } catch (e) {
        console.warn("Gagal muat Google Sheet:", e);
        applyMain(FALLBACK, "Google Sheet gagal (" + (e && e.message || e) + ") — memakai data cadangan", "err");
      }
    }

    async function loadAnalisa() {
      if (!CSV_URL_ANALISA) {
        applyAnalisa(getFallbackAnalisa(), "Link Google Sheet Analisa BHS belum diisi", "warn");
        return;
      }
      if (activeMenu === "analisa-mesin") setStatus("warn", "Menghubungkan ke Google Sheet Analisa BHS…");
      try {
        const recs = toAnalisaRecords(await fetchCsvText(CSV_URL_ANALISA));
        if (!recs.length) throw new Error("Data kosong");
        applyAnalisa(recs, "Live dari Google Sheet (Analisa Regu BHS)", "ok");
      } catch (e) {
        console.warn("Gagal muat Google Sheet:", e);
        applyAnalisa(getFallbackAnalisa(), "Google Sheet gagal (" + (e && e.message || e) + ") — memakai data cadangan September 2026", "err");
      }
    }

    async function loadAll() {
      await Promise.all([loadMain(), loadAnalisa()]);
    }

    // Event Sidebar & Toggle
    document.querySelectorAll(".sb-item").forEach(btn => {
      btn.addEventListener("click", () => switchMenu(btn.dataset.menu));
    });
    $("btnToggleMenu").onclick = openMobileSidebar;
    $("sbClose").onclick = closeMobileSidebar;
    $("sbBackdrop").onclick = closeMobileSidebar;

    $("selBulan").onchange  = render;
    $("selTahun").onchange  = render;
    $("btnRefresh").onclick = loadAll;
    $("file").onchange = e => {
      const f = e.target.files[0];
      if (!f) return;
      f.text()
        .then(t => {
          if (activeMenu === "analisa-mesin") {
            applyAnalisa(toAnalisaRecords(t), "Data Analisa dari CSV manual: " + f.name, "warn");
          } else {
            applyMain(toRecords(t), "Data dari CSV manual: " + f.name, "warn");
          }
        })
        .catch(err => alert("CSV tidak valid: " + (err && err.message ? err.message : "")));
    };

    // Jalankan pertama kali
    loadAll();

    // Registrasi Service Worker (PWA)
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(e => console.warn("SW gagal:", e));
      });
    }
  </script>
</body>
</html>
